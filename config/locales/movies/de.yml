        - "Es #{verb_s} wunderbar, bis es das absolut nicht mehr tut."
        - "Ein #{adj_lc} Film, der sich nicht benehmen will."
        - "Die Hälfte ist Quatsch und ich würde ihn zweimal ansehen."
        - "Niemand hat danach gefragt und trotzdem sind wir dankbar."
        - "Die Kamera bleibt eine Sekunde zu lange und genau das funktioniert."
        - "Nimm jemanden mit, den du liebst, oder geh allein."
        - "Es #{verb_s} wie eine Erinnerung, an die man sich nicht sicher ist."
        - "Für eine Weile habe ich vergessen, dass ich im Kino sitze."
        - "Das Ende hält das Ganze mehr oder weniger zusammen."
        - "Ruhig, langsam und weitaus wütender als das Plakat vermuten lässt."
        - "Ich habe gelacht, dann nicht mehr, dann wieder."
        - "Der #{noun} spielt die Hauptrolle – und gut."
        - "Ein sehr #{adj_lc} Film über sehr gewöhnliche Menschen."
        - "Zwei Stunden sind weg. Ich würde ihm noch zwei geben."
        - "Er versteht etwas, das die letzten vier Filme nicht verstanden haben."
        - "Nicht perfekt, nicht langweilig und bestimmt nicht fertig mit mir."
        - "Die Musik bleibt, lange nachdem das Licht angegangen ist."

