        - "Ein #{adj_lc} #{noun} und ein noch #{adj_lc} #{noun2} verbringen eine lange Nacht damit zu entscheiden, wer #{place} verlassen darf."
        - "Niemand glaubte den Briefen, bis der #{noun} eintraf – jede Woche, immer abgestempelt aus #{place}."
        - "Zwischen einer #{adj_event} und einer sehr schlechten Idee lernt eine Familie aus #{place}, was die Wahrheit kostet."
