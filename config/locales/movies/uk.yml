      review_sentence:
        - "Після перегляду я ще кілька днів думав про #{noun}."
        - "Якось воно водночас дивне і зовсім не таке."
        - "Сам лише #{noun} вартий вартості квитка."
        - "Це чудово #{verb_s}, поки раптом ні."
        - "Дуже дивна стрічка, що не вміє поводитися."
        - "Половина цього — нісенітниця, і я подивився б удруге."
        - "Ніхто цього не просив, і все ж ми вдячні."
        - "Камера затримується на секунду довше, і саме це працює."
        - "Візьми того, кого любиш, або йди сам."
        - "Це #{verb_s} наче спогад, у якому ти не певен."
        - "Деякий час я забув, що сиджу в залі."
        - "Фінал тримає все разом, більш-менш."
        - "Спокійний, #{adj} і значно зліший, ніж обіцяє афіша."
        - "Я сміявся, потім — ні, потім знову."
        - "#{noun} тут грає головну роль, і грає добре."
        - "Дуже #{adj} фільм про цілком звичайних людей."
        - "Дві години зникли. Я віддав би ще дві."
        - "Він розуміє те, чого не зрозуміли останні чотири фільми."
        - "Не ідеально, не нудно і точно ще не закінчився зі мною."
        - "Музика залишається задовго після того, як увімкнеться світло."

