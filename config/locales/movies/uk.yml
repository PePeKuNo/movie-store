        - "Коли останнє світло у #{place} згасає, якийсь #{adj} незнайомець вирішує, що саме він це полагодить."
        - "#{adjective} #{noun} і ще #{adjective} #{noun2} проводять довгу ніч, вирішуючи, кому дозволено піти з #{place}."
        - "Ніхто не вірив листам, доки #{noun} не почав приходити — щотижня, завжди з #{place}."
        - "Ця #{adj_event} і дуже погана ідея змусили родину з #{place} нарешті сказати правду."
        - "Він присягався більше ніколи не #{verb}, аж поки перед дверима не з'явився #{adj} #{noun}."
        - "У місті, де всі пам'ятають усе, #{adj} #{noun} вирішує забути навмисно."
        - "Троє незнайомців ділять дорогу з #{place} — і ніхто з них не каже всієї правди."
        - "Мав тривати одинадцять хвилин. Він працює вже #{noun3}."
        - "#{adjective} #{noun} записує все, що бачить, а хтось у #{place} хоче повернути плівки."

