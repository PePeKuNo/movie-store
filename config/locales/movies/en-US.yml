      review_sentence:
        - "I could not stop thinking about the #{noun} for days."
        - "Somehow it is #{adjective} and #{adjective} at the same time."
        - "The #{noun} alone is worth the price of the ticket."
        - "It #{verb_s} beautifully until it absolutely does not."
        - "A #{adjective} little picture that refuses to behave."
        - "Half of it is nonsense and I would watch it twice."
        - "Nobody asked for this and yet here we are, grateful."
        - "The camera stays #{adjective} a few seconds too long and it works."
        - "Bring someone you love, or bring nobody at all."
        - "It #{verb_s} like a memory you are not sure you have."
        - "For a while I forgot I was sitting in a cinema."
        - "The ending #{verb_s} the whole thing together, mostly."
        - "Quiet, #{adjective}, and much angrier than the poster suggests."
        - "I laughed, then I did not, then I laughed again."
        - "The #{noun} is doing all the acting and doing it well."
        - "A very #{adjective} film about very ordinary people."
        - "Two hours vanish. I would give it another two."
        - "It understands something the last four films I saw did not."
        - "Not perfect, not boring, and definitely not finished with me."
        - "The score keeps #{verb_ing} long after the lights come up."

      verb_s:
        - lands
        - drifts
        - collapses
        - glows
        - breaks
        - holds
        - floats
        - aches
        - returns
        - burns
        - settles
        - wanders

      synopsis:
        - "Years after a #{adj_event}, the #{adj_lc} #{noun} returns to #{place} to find that nothing there forgives quietly."
        - "When the last #{noun} in #{place} goes dark, the #{adj_lc} stranger decides to be the one who fixes it."
        - "The #{adj_lc} #{noun} and an even more stubborn #{noun2} spend one long night deciding who gets to leave #{place}."
        - "Nobody believed the letters until the #{noun} started arriving, one a week, always postmarked from #{place}."
        - "Between two #{adj_event} and one very bad idea, a family from #{place} learns how expensive the truth really is."
        - "He swore he would never #{verb} again, and then the #{adj_lc} #{noun} showed up at the door."
        - "In the #{adj_lc} town where everyone remembers everything, one #{noun} decides to forget on purpose."
        - "Three strangers share a ride out of #{place} and none of them are telling the whole story."
        - "The experiment was supposed to last eleven minutes. It has now been running for #{noun3}."
        - "The #{adj_lc} #{noun} records everything she sees, and someone in #{place} wants the tapes back."

