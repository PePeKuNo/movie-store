# Locale dataset for the region "en-US" (English - United States).
# Everything that is specific to a language/region lives in these files so
# that new languages/regions can be added without touching Ruby/JS code.
en-US:
  faker:
    movie_store:
      genre:
        - Action
        - Adventure
        - Animation
        - Comedy
        - Crime
        - Documentary
        - Drama
        - Fantasy
        - Horror
        - Mystery
        - Romance
        - Sci-Fi
        - Thriller
        - Western
        - Musical
        - Sports
        - Family
        - War
        - Historical
        - Neo-Noir

      title_pattern:
        - "#{adjective} #{noun}"
        - "The #{noun} of #{abstract_noun}"
        - "The Last #{noun}"
        - "#{noun} and #{abstract_noun}"
        - "#{abstract_noun} of #{place}"
        - "#{verb_ing} in #{place}"
        - "#{phrase}"
        - "#{phrase}: #{suffix}"
        - "#{place} #{abstract_noun}"
        - "No More #{abstract_noun}"
        - "#{adjective} #{noun}"
        - "#{verb_ing} #{abstract_noun}"
        - "#{phrase}, #{plead}"
        - "#{noun} #{suffix}"
        - "Beyond the #{noun}"
        - "#{adjective} #{abstract_noun}"
        - "#{phrase} Again"
        - "Under #{place}"

